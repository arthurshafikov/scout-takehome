version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: build/app/Dockerfile
      target: dev
    ports:
      - "8080:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_PORT: "8080"
      SQLITE_DB_PATH: /app/dataset/predictions.db
      API_KEY: scout-api-key-12345
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: scout
      MINIO_USE_SSL: "false"
      THUMBNAIL_CACHE_TTL_HOURS: "24"
    depends_on:
      - minio
    volumes:
      - ./dataset:/app/dataset
    networks:
      - scout-network
    container_name: scout-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - scout-network
    container_name: scout-frontend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - scout-network
    container_name: scout-minio

networks:
  scout-network:
    driver: bridge

volumes:
  minio_data:
