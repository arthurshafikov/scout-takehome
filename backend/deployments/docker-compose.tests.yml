services:
  app:
    build:
      context: ../.
      dockerfile: ./build/tests/Dockerfile
    environment:
      WAIT_HOSTS: pgsql_test:5432
    volumes:
      - ../:/go/src
    depends_on: 
      - pgsql_test 
    networks:
      - test
  pgsql_test:
      image: postgres:16.3
      restart: on-failure
      ports:
        - 54400:5432
      environment:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -d test"]
        interval: 4s
        timeout: 30s
        retries: 15
      networks:
        - test

networks:
  test:
